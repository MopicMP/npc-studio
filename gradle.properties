# Done to increase the memory available to gradle.
# 1G was the template's default and it is not enough here: Loom holds the whole
# remapped Minecraft on the heap, and the daemon was dying mid-compile.
#
# Three gigabytes is what a build needs and it is not what the daemon should be
# holding while the game is running. Those are the same process: `gradlew
# runClient` builds, forks the game, and then sits there for the whole session
# still owning every page it touched during the build. On a six-gigabyte laptop
# that is half the machine held by something that has finished its work — and it
# is why a shader pack that wants a few hundred megabytes of native memory found
# 127 MB of physical RAM and 7 MB of page file left.
#
# So the ceiling stays and the floor is made to fall. G1 will hand memory back to
# the operating system, but only if it is asked: a periodic collection while
# nothing is happening, made a full one rather than a concurrent one because a
# full one is what actually shrinks the heap, and free-ratio bounds tight enough
# that shrinking is worth doing. None of this lowers what a build may use.
org.gradle.jvmargs=-Xmx3G -XX:G1PeriodicGCInterval=30000 -XX:-G1PeriodicGCInvokesConcurrent -XX:G1PeriodicGCSystemLoadThreshold=0 -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=30
org.gradle.parallel=true

# What the game itself is allowed, used by the `client` run in build.gradle.
#
# The default when nobody says is a quarter of the machine, which here was
# 1506 MB — and the heap has never been the thing that ran out: at the crash it
# was using 495 MB of that. Two gigabytes is room to spare rather than a fix, and
# G1 only commits what it is actually asked for, so the extra costs nothing until
# something needs it.
#
# On a machine with less than eight gigabytes, going higher than this is a way to
# make crashes more likely and not less: the graphics driver compiles shaders in
# native memory, which is whatever the heap has not taken.
client_heap_min=512M
client_heap_max=2G

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=com.mopicmp.npcstudio

# Dependencies
fabric_api_version=0.156.0+26.2
